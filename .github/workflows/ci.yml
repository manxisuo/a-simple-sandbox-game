name: Build Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install type-check dependencies
        run: npm install --no-save typescript@7.0.2 @types/three@latest

      - name: Type Check
        run: npm run typecheck

      - name: Build
        run: npm run build
